[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "web"
version = "0.1.0"
requires-python=">=3.12"
dependencies = [
    "gradio==5.33.0",
    "hydra-core==1.3.2"
]

[project.optional-dependencies]
dev = [
    "requests==2.32.3",
    "uvicorn==0.34.3",
    "fastapi==0.115.12"
]