---
name: rag-application

services:
  web:
    build:
      context: web/
      dockerfile: web.dev.Dockerfile
    ports:
      - 80:80
    env_file:
      - web/.env
    volumes:
      - ./persistent_data/web:/home/appuser/data
      - ./web:/home/appuser/app
    depends_on:
      backend_entrypoint:
        condition: service_healthy


  backend_entrypoint:
    build:
      context: backend_entrypoint/
      dockerfile: backend_entrypoint.dev.Dockerfile
    ports:
      - 8080:8080
    env_file:
      - backend_entrypoint/.env
    volumes:
      - ./persistent_data/backend_entrypoint:/home/appuser/data
      - ./backend_entrypoint:/home/appuser/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://$$HOST:$$PORT/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
